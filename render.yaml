services:
  - type: web
    name: voice-hhgoa
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: QDRANT_PATH
        value: qdrant_storage/deploy
      - key: DEFAULT_ANSWER_MODE
        value: fast
      - key: RETRIEVAL_MODE
        value: sparse
      - key: SKIP_STARTUP_WARMUP
        value: "0"
      - key: DATASET_RECORDS
        value: "1315"
      - key: DATASET_CHUNKS
        value: "2171"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
